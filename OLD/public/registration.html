<!doctype html>
<html>
<head><meta charset="utf-8"><title>Register — OUTSINC</title></head>
<body>
<h1>Register (demo)</h1>
<form method="post" action="/src/register_stub.php">
  <label>Username: <input name="username" required></label><br>
  <label>Password: <input type="password" name="password" required></label><br>
  <label>Confirm Password: <input type="password" name="password_confirm" required></label><br>
  <label>Email: <input type="email" name="email"></label><br>
  <label>Preferred name / alias: <input name="alias"></label><br>
  <label>Age range:
    <select name="age_range">
      <option value="">Select</option>
      <option>Under 18</option>
      <option>18-24</option>
      <option>25-59</option>
      <option>60+</option>
    </select>
  </label><br>
  <label>Preferred language:
    <select name="preferred_language">
      <option>English</option>
      <option>French</option>
      <option>ASL</option>
    </select>
  </label><br>
  <label>Consent to coordinate:
    <select name="consent_to_coordinate">
      <option value="partial">Partial</option>
      <option value="full">Full</option>
      <option value="none">None</option>
    </select>
  </label><br>
  <button type="submit">Create account (demo)</button>
</form>
<p>This is a placeholder registration page. Backend registration endpoint not implemented in this scaffold.</p>
</body>
</html>
